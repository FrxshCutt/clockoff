# RETIRED at the Railway cutover: production runs on Railway (railway/web.json + railway/worker.json,
# docker/web + docker/worker). This file only lets the old Netlify site keep building until DNS moves;
# it is deleted (with build:netlify and @netlify/plugin-nextjs) once Railway serves every hostname.
# It schedules nothing: background jobs run only in the Railway worker service.
#
# Monorepo layout: Netlify site "Package directory" = apps/web (this file's folder), base directory = repo root.

[build]
  command = "pnpm --filter @clockoff/web run build:netlify"   # prisma generate → next build
  publish = "apps/web/.next"   # relative to the base directory (repo root)

[build.environment]
  NODE_VERSION = "22"
  # Use the pnpm pinned in package.json#packageManager.
  PNPM_VERSION = "11.10.0"

# Netlify's Next.js runtime. Declared explicitly (and pinned in apps/web devDependencies) because framework
# auto-detection looks at the base directory (repo root), which has no "next" dependency.
[[plugins]]
  package = "@netlify/plugin-nextjs"
