# XcodeGen spec — the source of truth for ClockOff.xcodeproj (regenerate with `make generate`).
# Settings live in Config/*.xcconfig; this file only wires targets, Info.plists and entitlements.
name: ClockOff
options:
  bundleIdPrefix: online.clockoff
  deploymentTarget:
    iOS: "16.4"
  developmentLanguage: en
  createIntermediateGroups: true
  groupSortPosition: top
  xcodeVersion: "26.0"
  defaultConfig: Debug

configs:
  Debug: debug
  Release: release

configFiles:
  Debug: Config/Debug.xcconfig
  Release: Config/Release.xcconfig

packages:
  WorkModeCore:
    path: Packages/WorkModeCore

targets:
  ClockOffApp:
    type: application
    platform: iOS
    configFiles:
      Debug: Config/Debug.xcconfig
      Release: Config/Release.xcconfig
    sources:
      - path: ClockOffApp
    settings:
      base:
        PRODUCT_NAME: ClockOffApp
        PRODUCT_BUNDLE_IDENTIFIER: $(CLOCKOFF_APP_BUNDLE_ID)
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: YES
    info:
      path: ClockOffApp/Info.plist
      properties:
        CFBundleDisplayName: ClockOff
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIBackgroundModes:
          - fetch
          - remote-notification
          - processing
        BGTaskSchedulerPermittedIdentifiers:
          - online.clockoff.app.refresh
        NSFamilyControlsUsageDescription: >-
          ClockOff uses Screen Time to block the apps you choose only while you are on shift, relaxes the blocks
          on breaks and lifts them when your shift ends. Your employer can see whether Work Mode is set up and
          working, but never which apps you choose, your messages, photos, browsing or how you use your phone.
        API_BASE_URL: $(API_BASE_URL)
        ClockOffPushEnvironment: $(CLOCKOFF_PUSH_ENVIRONMENT)
        ClockOffAppGroup: $(CLOCKOFF_APP_GROUP)
    entitlements:
      path: ClockOffApp/ClockOffApp.entitlements
      properties:
        com.apple.developer.family-controls: true
        com.apple.security.application-groups:
          - group.online.clockoff.app.shared
        aps-environment: development
    dependencies:
      - package: WorkModeCore
        product: WorkModeCore
      # Shared ManagedSettings/FamilyControls adapter (also linked by the DeviceActivityMonitor extension).
      - package: WorkModeCore
        product: WorkModeScreenTime
      - target: ClockOffDeviceActivityMonitor
      - target: ClockOffShieldConfiguration
      - target: ClockOffShieldAction
    postBuildScripts:
      # Local development API: plain HTTP to local hosts (localhost, *.local, LAN) and the local-network
      # privacy prompt text are added in Debug only (CLOCKOFF_ALLOW_LOCAL_HTTP). Release never gets them
      # (`make build-release` verifies). Runs after Info.plist processing, before signing.
      - name: Debug-only local HTTP (ATS)
        basedOnDependencyAnalysis: false
        inputFiles:
          - $(TARGET_BUILD_DIR)/$(INFOPLIST_PATH)
        script: |
          set -eu
          PLIST="${TARGET_BUILD_DIR}/${INFOPLIST_PATH}"
          /usr/libexec/PlistBuddy -c "Delete :NSAppTransportSecurity:NSAllowsLocalNetworking" "$PLIST" >/dev/null 2>&1 || true
          /usr/libexec/PlistBuddy -c "Delete :NSLocalNetworkUsageDescription" "$PLIST" >/dev/null 2>&1 || true
          if [ "${CLOCKOFF_ALLOW_LOCAL_HTTP:-NO}" = "YES" ]; then
            /usr/libexec/PlistBuddy -c "Add :NSAppTransportSecurity dict" "$PLIST" >/dev/null 2>&1 || true
            /usr/libexec/PlistBuddy -c "Add :NSAppTransportSecurity:NSAllowsLocalNetworking bool true" "$PLIST"
            /usr/libexec/PlistBuddy -c "Add :NSLocalNetworkUsageDescription string 'Development builds only: lets ClockOff reach the test server on your local network.'" "$PLIST"
            echo "note: local development HTTP enabled (${CONFIGURATION})"
          fi

  ClockOffDeviceActivityMonitor:
    type: app-extension
    platform: iOS
    configFiles:
      Debug: Config/Debug.xcconfig
      Release: Config/Release.xcconfig
    sources:
      - path: ClockOffDeviceActivityMonitor
    settings:
      base:
        PRODUCT_NAME: ClockOffDeviceActivityMonitor
        PRODUCT_BUNDLE_IDENTIFIER: $(CLOCKOFF_MONITOR_BUNDLE_ID)
        APPLICATION_EXTENSION_API_ONLY: YES
    info:
      path: ClockOffDeviceActivityMonitor/Info.plist
      properties:
        CFBundleDisplayName: ClockOff Monitor
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.deviceactivity.monitor-extension
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).DeviceActivityMonitorExtension
    entitlements:
      path: ClockOffDeviceActivityMonitor/ClockOffDeviceActivityMonitor.entitlements
      properties:
        com.apple.developer.family-controls: true
        com.apple.security.application-groups:
          - group.online.clockoff.app.shared
    dependencies:
      - package: WorkModeCore
        product: WorkModeCore
      - package: WorkModeCore
        product: WorkModeScreenTime

  ClockOffShieldConfiguration:
    type: app-extension
    platform: iOS
    configFiles:
      Debug: Config/Debug.xcconfig
      Release: Config/Release.xcconfig
    sources:
      - path: ClockOffShieldConfiguration
    settings:
      base:
        PRODUCT_NAME: ClockOffShieldConfiguration
        PRODUCT_BUNDLE_IDENTIFIER: $(CLOCKOFF_SHIELD_CONFIG_BUNDLE_ID)
        APPLICATION_EXTENSION_API_ONLY: YES
    info:
      path: ClockOffShieldConfiguration/Info.plist
      properties:
        CFBundleDisplayName: ClockOff Shield
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.ManagedSettingsUI.shield-configuration-service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShieldConfigurationExtension
    entitlements:
      path: ClockOffShieldConfiguration/ClockOffShieldConfiguration.entitlements
      properties:
        # Screen Time (ManagedSettings) extensions carry Family Controls like the app and the monitor.
        com.apple.developer.family-controls: true
        com.apple.security.application-groups:
          - group.online.clockoff.app.shared
    dependencies:
      - package: WorkModeCore
        product: WorkModeCore

  ClockOffShieldAction:
    type: app-extension
    platform: iOS
    configFiles:
      Debug: Config/Debug.xcconfig
      Release: Config/Release.xcconfig
    sources:
      - path: ClockOffShieldAction
    settings:
      base:
        PRODUCT_NAME: ClockOffShieldAction
        PRODUCT_BUNDLE_IDENTIFIER: $(CLOCKOFF_SHIELD_ACTION_BUNDLE_ID)
        APPLICATION_EXTENSION_API_ONLY: YES
    info:
      path: ClockOffShieldAction/Info.plist
      properties:
        CFBundleDisplayName: ClockOff Shield Action
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.ManagedSettings.shield-action-service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShieldActionExtension
    entitlements:
      path: ClockOffShieldAction/ClockOffShieldAction.entitlements
      properties:
        # Screen Time (ManagedSettings) extensions carry Family Controls like the app and the monitor.
        com.apple.developer.family-controls: true
        com.apple.security.application-groups:
          - group.online.clockoff.app.shared
    dependencies:
      - package: WorkModeCore
        product: WorkModeCore

  ClockOffAppTests:
    type: bundle.unit-test
    platform: iOS
    configFiles:
      Debug: Config/Debug.xcconfig
      Release: Config/Release.xcconfig
    sources:
      - path: ClockOffAppTests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(CLOCKOFF_TESTS_BUNDLE_ID)
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/ClockOffApp.app/ClockOffApp
        BUNDLE_LOADER: $(TEST_HOST)
    # WorkModeCore is deliberately NOT linked here: the tests use the host app's copy, so types such as
    # APIError are the same type in test and app code (two static copies would break dynamic casts).
    dependencies:
      - target: ClockOffApp

schemes:
  ClockOffApp:
    build:
      targets:
        ClockOffApp: all
        ClockOffAppTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: false
      targets:
        - name: ClockOffAppTests
        - package: WorkModeCore/WorkModeCoreTests
        - package: WorkModeCore/WorkModeScreenTimeTests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
